name: Metrics
on:
    # Schedule updates every 8 hours
    schedule: [{ cron: "0 */8 * * *" }]
    # (optional) Run workflow manually
    workflow_dispatch:
    # (optional) Run workflow when pushing on master/main
    push: { branches: ["master", "main"] }
jobs:
    github-metrics:
        runs-on: ubuntu-latest
        environment:
            name: production
        permissions:
            contents: write
        steps:
            # The v3.34 Dockerfile no longer builds (gem install licensed fails on
            # nokogiri), so don't let the forked action rebuild from source. Derive
            # from upstream's prebuilt image, drop in the patched habits plugin, and
            # tag it as the name the forked action expects so it skips its own build.
            - name: Prepare patched metrics image
              env:
                  FORK_SHA: 49527d13d8c4eeee595564ef9c5bb6f83c0975e6
              run: |
                  mkdir -p /tmp/metrics-patch
                  curl -fsSL "https://raw.githubusercontent.com/ethan-yz-hao/metrics/${FORK_SHA}/source/plugins/habits/index.mjs" -o /tmp/metrics-patch/index.mjs
                  cat > /tmp/metrics-patch/Dockerfile <<'EOF'
                  FROM ghcr.io/lowlighter/metrics:v3.34
                  COPY index.mjs /metrics/source/plugins/habits/index.mjs
                  EOF
                  docker build -t metrics:forked-3.34.0 /tmp/metrics-patch
                  docker run --rm --entrypoint grep metrics:forked-3.34.0 -qF "payload?.commits ?? []" /metrics/source/plugins/habits/index.mjs
                  echo "Patched habits plugin verified inside image"

            - name: Left
              uses: ethan-yz-hao/metrics@49527d13d8c4eeee595564ef9c5bb6f83c0975e6 # v3.34 + habits null-guard
              with:
                  token: ${{ secrets.METRICS_TOKEN }}
                  output_action: gist
                  committer_gist: ${{ secrets.GIST }}
                  filename: left.svg

                  # Options
                  template: classic
                  base: header, activity, community, repositories, metadata
                  config_timezone: America/New_York
                  # Include forks
                  repositories_forks: yes
                  # About me
                  plugin_introduction: yes
                  plugin_introduction_title: yes

                  # People
                  plugin_people: yes
                  plugin_people_limit: 24
                  plugin_people_size: 28
                  plugin_people_types: followers, following

                  # Starred Topics
                  plugin_topics: yes
                  plugin_topics_mode: icons
                  plugin_topics_limit: 20

                  # Commits calendar
                  plugin_calendar: yes
                  plugin_calendar_limit: 2

                  config_order: base.header, introduction, base.activity+community, base.repositories, people, topics, calendar

            - name: Right
              uses: ethan-yz-hao/metrics@49527d13d8c4eeee595564ef9c5bb6f83c0975e6 # v3.34 + habits null-guard
              with:
                  token: ${{ secrets.METRICS_TOKEN }}
                  output_action: gist
                  committer_gist: ${{ secrets.GIST }}
                  filename: right.svg

                  # Options
                  template: classic
                  base: ""
                  config_timezone: America/New_York

                  # Languages activity
                  plugin_languages: yes
                  plugin_languages_analysis_timeout: 15
                  plugin_languages_analysis_timeout_repositories: 7.5
                  # plugin_languages_categories: markup, programming
                  plugin_languages_colors: github
                  plugin_languages_limit: 8
                  plugin_languages_recent_categories: markup, programming
                  # plugin_languages_recent_days: 14
                  # plugin_languages_recent_load: 300
                  plugin_languages_sections: most-used
                  plugin_languages_threshold: 0%
                  plugin_languages_details: lines
                  plugin_languages_ignored: >-
                      html, css, jupyter%20notebook

                  # Isometric commit calendar
                  plugin_isocalendar: yes
                  plugin_isocalendar_duration: full-year

                  # Coding habits
                  plugin_habits: yes
                  plugin_habits_charts_type: classic
                  # plugin_habits_days: 14
                  plugin_habits_facts: yes
                  # plugin_habits_from: 200
                  plugin_habits_languages_limit: 8

                  # Recently starred repositories
                  plugin_stars: yes
                  plugin_stars_limit: 4

            # Keep this scheduled workflow from being auto-disabled: metrics
            # commits to a gist, not this repo, so GitHub would disable the cron
            # after 60 days of no repo activity. This makes a periodic commit.
            - name: Checkout
              if: github.event_name == 'schedule'
              uses: actions/checkout@v4

            - name: Keepalive
              if: github.event_name == 'schedule'
              run: |
                  age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
                  echo "Last commit was ${age} day(s) ago"
                  if [ "$age" -ge 50 ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git commit --allow-empty -m "chore: keepalive for scheduled workflow"
                      git push
                  fi
